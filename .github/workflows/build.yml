name: Build & Release

on:
  # 手动触发
  workflow_dispatch:

  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

# 授予 GITHUB_TOKEN 写入权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    env:
      # 仅在 tag 推送事件中发布到 GitHub Releases。
      IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 构建前端
        run: npm run web:build

      - name: 🚀 打包并发布 Electron（仅 tag 推送）
        if: env.IS_TAG_PUSH == 'true'
        run: npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 打包 Electron（手动触发不发布）
        if: env.IS_TAG_PUSH != 'true'
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
