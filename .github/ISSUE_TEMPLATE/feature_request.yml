name: Feature Request
description: 提交功能建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请说明场景与价值，避免仅描述实现细节。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      placeholder: 当前流程中的痛点是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议方案
      placeholder: 希望新增什么能力？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
