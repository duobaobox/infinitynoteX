name: Build & Release

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：填写 v1.2.0 时会在构建后发布到该 tag'
        required: false
        type: string

  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

# 授予 GITHUB_TOKEN 写入权限
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64 + arm64
            os: macos-15-intel
            artifact: mac
            build_args: --mac --x64 --arm64
          - os: windows-latest
            name: Windows x64
            artifact: win
            build_args: --win --x64
          - os: ubuntu-latest
            name: Linux x64
            artifact: linux
            build_args: --linux --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🔎 校验 tag 与 package 版本一致
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          node -e 'const tag=process.env.RELEASE_TAG; const version=require("./package.json").version; if (tag !== "v" + version) { console.error("Tag " + tag + " does not match package.json version v" + version); process.exit(1); }'

      - name: 🔨 构建前端
        run: npm run web:build

      - name: 📦 打包 Electron
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.snap
            release/**/*.nupkg
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.release_tag != ''

    steps:
      - name: 📥 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: 🚀 发布到 GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          files=(
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/*.rpm
            dist-artifacts/**/*.snap
            dist-artifacts/**/*.nupkg
            dist-artifacts/**/*.yml
            dist-artifacts/**/*.blockmap
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No release files found in dist-artifacts"
            find dist-artifacts -type f | sort
            exit 1
          fi

          printf 'Release files:\n'
          printf ' - %s\n' "${files[@]}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --draft=false \
              --prerelease=false \
              --latest
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
