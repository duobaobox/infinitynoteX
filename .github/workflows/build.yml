name: Build & Release

on:
  # 手动触发
  workflow_dispatch:

  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

# 授予 GITHUB_TOKEN 写入权限
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64 + arm64
            os: macos-15-intel
            artifact: mac
            build_args: --mac --x64 --arm64
          - os: windows-latest
            name: Windows x64
            artifact: win
            build_args: --win --x64
          - os: ubuntu-latest
            name: Linux x64
            artifact: linux
            build_args: --linux --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm ci

      - name: 🔎 校验 tag 与 package 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e 'const tag=process.env.GITHUB_REF_NAME; const version=require("./package.json").version; if (tag !== "v" + version) { console.error("Tag " + tag + " does not match package.json version v" + version); process.exit(1); }'

      - name: 🔨 构建前端
        run: npm run web:build

      - name: 📦 打包 Electron
        run: npx electron-builder ${{ matrix.build_args }} --publish never

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.snap
            release/**/*.nupkg
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: 🚀 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/*.rpm
            dist-artifacts/**/*.snap
            dist-artifacts/**/*.nupkg
            dist-artifacts/**/*.yml
            dist-artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
