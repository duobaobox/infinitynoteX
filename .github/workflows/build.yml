name: Build & Release

on:
  # 手动触发（在 GitHub 网页上点击按钮）
  workflow_dispatch:
    inputs:
      release:
        description: '是否发布到 Release'
        required: false
        default: 'false'
        type: boolean

  # 推送 tag 时自动触发（如 v1.0.0）
  push:
    tags:
      - 'v*'

# 授予 GITHUB_TOKEN 写入权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build_cmd: npm run web:build && electron-builder --mac --publish never
          - os: windows-latest
            platform: win
            build_cmd: npm run web:build && electron-builder --win --publish never
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run web:build && electron-builder --linux --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 构建应用
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.yml
            release/**/*.blockmap
          retention-days: 7

  # 可选：自动发布到 GitHub Releases
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📋 列出下载的文件
        run: ls -R artifacts

      - name: 🚀 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.yml
            artifacts/**/*.blockmap
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
