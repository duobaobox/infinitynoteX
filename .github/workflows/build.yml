name: Build & Release

on:
  # 手动触发
  workflow_dispatch:

  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

# 授予 GITHUB_TOKEN 写入权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装依赖
        run: npm install

      - name: 🔨 构建前端
        run: npm run web:build

      - name: 📦 打包 Electron
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: 🚀 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, updating assets..."
          else
            gh release create "$TAG_NAME" \
              --repo "$REPO" \
              --title "$TAG_NAME" \
              --draft \
              --notes ""
          fi

          mapfile -t files < <(find dist-artifacts -type f \
            ! -name '*.blockmap' \
            ! -name '*.yaml' \
            ! -name '*.yml')

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release files found."
            exit 1
          fi

          gh release upload "$TAG_NAME" "${files[@]}" --repo "$REPO" --clobber
