name: Build & Release

on:
  # 手动触发
  workflow_dispatch:

  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

# 授予 GITHUB_TOKEN 写入权限
permissions:
  contents: write

# 定义全局环境变量
env:
  NODE_VERSION: 20
  # 使用淘宝镜像加速 Electron 下载
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 缓存 Electron 二进制文件
      - name: 📦 缓存 Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 📦 安装依赖
        run: npm ci
        env:
          # 使用淘宝 npm 镜像
          npm_config_registry: https://registry.npmmirror.com

      - name: 🔨 构建前端
        run: npm run web:build

      - name: 📦 打包 Electron (Mac)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never

      - name: 📦 打包 Electron (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: 📦 打包 Electron (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.AppImage
            release/**/latest*.yml
            release/**/*.blockmap
            !release/**/builder-debug.yml
            !release/**/app-update.yml
          retention-days: 7
          compression-level: 0 # 产物已压缩，无需再压缩

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📋 列出下载的文件
        run: ls -R artifacts

      - name: 🚀 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          repository: duobaobox/duobaobox-infinitynotex-releases
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
